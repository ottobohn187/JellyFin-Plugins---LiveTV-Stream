name: Publish Plugin Feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-plugin-feed.yml"
      - "Fox43StreamPlugin/**"
      - "Abc27StreamPlugin/**"
      - "ReleaseWatcherPlugin/**"
      - "MusicVideoVisualizerPlugin/**"
      - "DefaultDateAddedPlugin/**"
      - "build.yaml"
      - "abc27.build.yaml"
      - "release-watcher.build.yaml"
      - "music-video-visualizer.build.yaml"
      - "default-date-added.build.yaml"
      - "scripts/update_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install pyyaml

      - name: Restore FOX43 plugin
        run: dotnet restore Fox43StreamPlugin/Jellyfin.Plugin.Fox43Stream/Jellyfin.Plugin.Fox43Stream.csproj

      - name: Publish FOX43 plugin
        run: dotnet publish Fox43StreamPlugin/Jellyfin.Plugin.Fox43Stream/Jellyfin.Plugin.Fox43Stream.csproj -c Release -o artifacts/fox43

      - name: Read FOX43 plugin version
        id: fox43_version
        run: |
          python - <<'PY'
          import os
          import yaml
          with open("build.yaml", "r", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={data['version']}\n")
          PY

      - name: Package FOX43 plugin
        id: fox43_package
        run: |
          mkdir -p packages
          zip_path="packages/fox43-stream-${{ steps.fox43_version.outputs.version }}.zip"
          cd artifacts/fox43
          zip -r "../../${zip_path}" .
          cd ../..
          checksum="$(md5sum "${zip_path}" | awk '{print $1}')"
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Update manifest for FOX43
        run: |
          python scripts/update_manifest.py \
            --build-yaml build.yaml \
            --manifest manifest.json \
            --source-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.fox43_package.outputs.zip_path }}" \
            --checksum "${{ steps.fox43_package.outputs.checksum }}" \
            --timestamp "${{ steps.fox43_package.outputs.timestamp }}"

      - name: Restore ABC27 plugin
        run: dotnet restore Abc27StreamPlugin/Jellyfin.Plugin.Abc27Stream/Jellyfin.Plugin.Abc27Stream.csproj

      - name: Publish ABC27 plugin
        run: dotnet publish Abc27StreamPlugin/Jellyfin.Plugin.Abc27Stream/Jellyfin.Plugin.Abc27Stream.csproj -c Release -o artifacts/abc27

      - name: Read ABC27 plugin version
        id: abc27_version
        run: |
          python - <<'PY'
          import os
          import yaml
          with open("abc27.build.yaml", "r", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={data['version']}\n")
          PY

      - name: Package ABC27 plugin
        id: abc27_package
        run: |
          mkdir -p packages
          zip_path="packages/abc27-stream-${{ steps.abc27_version.outputs.version }}.zip"
          cd artifacts/abc27
          zip -r "../../${zip_path}" .
          cd ../..
          checksum="$(md5sum "${zip_path}" | awk '{print $1}')"
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Update manifest for ABC27
        run: |
          python scripts/update_manifest.py \
            --build-yaml abc27.build.yaml \
            --manifest manifest.json \
            --source-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.abc27_package.outputs.zip_path }}" \
            --checksum "${{ steps.abc27_package.outputs.checksum }}" \
            --timestamp "${{ steps.abc27_package.outputs.timestamp }}"

      - name: Restore Release Watcher plugin
        run: dotnet restore ReleaseWatcherPlugin/Jellyfin.Plugin.ReleaseWatcher/Jellyfin.Plugin.ReleaseWatcher.csproj

      - name: Publish Release Watcher plugin
        run: dotnet publish ReleaseWatcherPlugin/Jellyfin.Plugin.ReleaseWatcher/Jellyfin.Plugin.ReleaseWatcher.csproj -c Release -o artifacts/release-watcher

      - name: Read Release Watcher plugin version
        id: release_watcher_version
        run: |
          python - <<'PY'
          import os
          import yaml
          with open("release-watcher.build.yaml", "r", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={data['version']}\n")
          PY

      - name: Package Release Watcher plugin
        id: release_watcher_package
        run: |
          mkdir -p packages
          zip_path="packages/release-watcher-${{ steps.release_watcher_version.outputs.version }}.zip"
          cd artifacts/release-watcher
          zip -r "../../${zip_path}" .
          cd ../..
          checksum="$(md5sum "${zip_path}" | awk '{print $1}')"
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Update manifest for Release Watcher
        run: |
          python scripts/update_manifest.py \
            --build-yaml release-watcher.build.yaml \
            --manifest manifest.json \
            --source-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.release_watcher_package.outputs.zip_path }}" \
            --checksum "${{ steps.release_watcher_package.outputs.checksum }}" \
            --timestamp "${{ steps.release_watcher_package.outputs.timestamp }}"

      - name: Restore Music Video Visualizer plugin
        run: dotnet restore MusicVideoVisualizerPlugin/Jellyfin.Plugin.MusicVideoVisualizer/Jellyfin.Plugin.MusicVideoVisualizer.csproj

      - name: Publish Music Video Visualizer plugin
        run: dotnet publish MusicVideoVisualizerPlugin/Jellyfin.Plugin.MusicVideoVisualizer/Jellyfin.Plugin.MusicVideoVisualizer.csproj -c Release -o artifacts/music-video-visualizer

      - name: Read Music Video Visualizer plugin version
        id: music_video_visualizer_version
        run: |
          python - <<'PY'
          import os
          import yaml
          with open("music-video-visualizer.build.yaml", "r", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={data['version']}\n")
          PY

      - name: Package Music Video Visualizer plugin
        id: music_video_visualizer_package
        run: |
          mkdir -p packages
          zip_path="packages/music-video-visualizer-${{ steps.music_video_visualizer_version.outputs.version }}.zip"
          cd artifacts/music-video-visualizer
          zip -r "../../${zip_path}" .
          cd ../..
          checksum="$(md5sum "${zip_path}" | awk '{print $1}')"
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"

      - name: Update manifest for Music Video Visualizer
        run: |
          python scripts/update_manifest.py \
            --build-yaml music-video-visualizer.build.yaml \
            --manifest manifest.json \
            --source-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.music_video_visualizer_package.outputs.zip_path }}" \
            --checksum "${{ steps.music_video_visualizer_package.outputs.checksum }}" \
            --timestamp "${{ steps.music_video_visualizer_package.outputs.timestamp }}"

      - name: Build and package Default Date Added
        id: default_date_added_package
        run: |
          dotnet publish DefaultDateAddedPlugin/Jellyfin.Plugin.DefaultDateAdded/Jellyfin.Plugin.DefaultDateAdded.csproj -c Release -o artifacts/default-date-added
          mkdir -p packages
          zip_path="packages/default-date-added-1.0.0.0.zip"
          (cd artifacts/default-date-added && zip -r "../../${zip_path}" .)
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=$(md5sum "${zip_path}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "${GITHUB_OUTPUT}"

      - name: Update manifest for Default Date Added
        run: |
          python scripts/update_manifest.py \
            --build-yaml default-date-added.build.yaml \
            --manifest manifest.json \
            --source-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.default_date_added_package.outputs.zip_path }}" \
            --checksum "${{ steps.default_date_added_package.outputs.checksum }}" \
            --timestamp "${{ steps.default_date_added_package.outputs.timestamp }}"

      - name: Commit published package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json packages
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Publish plugin package"
          git push
